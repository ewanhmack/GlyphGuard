# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin daemon can't reach its own loopback socket on this machine (VPN/EDR/Docker
# virtual adapter interference) - compile in-process instead of spawning a daemon.
kotlin.compiler.execution.strategy=in-process
